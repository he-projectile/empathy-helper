[project]
name = "emotion-assistant"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.1",
    "datasets>=5.0.0",
    "dvc>=3.67.1",
    "hydra-core>=1.3.3",
    "lightning>=2.6.5",
    "mlflow>=3.14.0",
    "numpy>=2.2.6",
    "omegaconf>=2.3.1",
    "onnx>=1.22.0",
    "onnxruntime>=1.24.3",
    "pandas>=2.3.3",
    "pre-commit>=4.6.0",
    "scikit-learn>=1.7.2",
    "torch>=2.12.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.27.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
